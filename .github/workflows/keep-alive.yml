name: Render Keep Alive

on:
  # Run every 10 minutes to prevent Render's 15-min inactivity sleep
  schedule:
    - cron: '*/10 * * * *'

  # Allow manual trigger via GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Application
        # -I: Fetch headers only (reduces bandwidth/latency)
        # -s: Silent mode (suppresses progress meter)
        run: curl -s -I https://wasipet.onrender.com
